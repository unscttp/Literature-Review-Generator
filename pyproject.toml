[project]
name = "literature-review-generator"
version = "1.2.0"
description = "Eight reviewed stages from a topic to a cited literature review, on Directed Growing Sheet."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6,<7"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests.support must be imported first: it puts the app and DGS on the path.
"tests/*" = ["I001"]
